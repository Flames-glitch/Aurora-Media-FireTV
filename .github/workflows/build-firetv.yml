
name: Build Aurora Media Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'AuroraMedia_FireTV_GitHub_Repo_v*.zip'
      - '.github/workflows/build-firetv.yml'

permissions:
  contents: read

jobs:
  firetv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract newest Fire TV project ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(AuroraMedia_FireTV_GitHub_Repo_v*.zip)

          if (( ${#archives[@]} == 0 )); then
            echo '::error::Fire TV ZIP not found'
            exit 1
          fi

          archive=$(printf '%s\n' "${archives[@]}" | sort -V | tail -1)
          echo "Using $archive"
          unzip -q "$archive" -d extracted

          test -f extracted/AuroraMedia_FireTV_GitHub_Repo/settings.gradle.kts
          test -f extracted/AuroraMedia_FireTV_GitHub_Repo/app/build.gradle.kts
          grep -q 'minSdk = 22' extracted/AuroraMedia_FireTV_GitHub_Repo/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER=$(command -v sdkmanager)
            fi
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'; then
                break
              fi
              sleep 10
            done
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Fire TV debug APK
        working-directory: extracted/AuroraMedia_FireTV_GitHub_Repo
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Verify APK compatibility and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=extracted/AuroraMedia_FireTV_GitHub_Repo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E 'package:|sdkVersion:|native-code:'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "sdkVersion:'22'"

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraMedia-FireTV-APK
          path: extracted/AuroraMedia_FireTV_GitHub_Repo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
